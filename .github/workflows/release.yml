name: Desktop binaries

# The release (with the signed APK) is created locally by scripts/release.sh so the
# signing key never leaves the maintainer's machine. This workflow then builds the
# desktop clients and attaches them to that release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build binary
        working-directory: client
        run: |
          python -m pip install -q -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name PocketLens-linux-x86_64 \
            --icon assets/icon.ico --add-data "assets:assets" --add-data "../VERSION:." --add-data "../REPO:." \
            --exclude-module sounddevice webcam_client.py
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: client/dist/PocketLens-linux-x86_64 }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build exe
        working-directory: client
        run: |
          python -m pip install -q -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name PocketLens-windows-x64 --icon assets/icon.ico `
            --add-data "assets:assets" --add-data "../VERSION:." --add-data "../REPO:." webcam_client.py
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: client/dist/PocketLens-windows-x64.exe }

  upload:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.apk' -D dist || true
          (cd dist && sha256sum * > SHA256SUMS.txt)
          rm -f dist/*.apk
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
